<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
  <!-- PLACEHOLDER sala Velvet Rose — sustituible por fotografía real -->
  <defs>
    <radialGradient id="s2glow" cx="26%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FF6B86" stop-opacity=".5"/>
      <stop offset="42%" stop-color="#B00B33" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#07060A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s2vel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#45101F" stop-opacity=".75"/>
      <stop offset="60%" stop-color="#24070F" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#07060A" stop-opacity=".9"/>
    </linearGradient>
    <filter id="s2soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="s2grain">
      <feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#0A0308"/>
  <rect width="1200" height="900" fill="url(#s2vel)"/>
  <rect width="1200" height="900" fill="url(#s2glow)"/>

  <!-- Cortina: pliegues verticales de terciopelo -->
  <g stroke="#EDE4D8" stroke-opacity=".055">
    <line x1="70" y1="0" x2="86" y2="900"/><line x1="170" y1="0" x2="192" y2="900"/>
    <line x1="270" y1="0" x2="286" y2="900"/><line x1="370" y1="0" x2="392" y2="900"/>
    <line x1="470" y1="0" x2="486" y2="900"/><line x1="570" y1="0" x2="592" y2="900"/>
    <line x1="670" y1="0" x2="686" y2="900"/><line x1="770" y1="0" x2="792" y2="900"/>
    <line x1="870" y1="0" x2="886" y2="900"/><line x1="970" y1="0" x2="992" y2="900"/>
    <line x1="1070" y1="0" x2="1092" y2="900"/>
  </g>

  <!-- Luz baja puntual sobre una mesa -->
  <g filter="url(#s2soft)">
    <ellipse cx="820" cy="520" rx="200" ry="90" fill="#FF1F4B" fill-opacity=".2"/>
  </g>
  <ellipse cx="820" cy="560" rx="150" ry="34" fill="#07060A" fill-opacity=".6"/>
  <line x1="670" y1="560" x2="970" y2="560" stroke="#FF6B86" stroke-opacity=".4"/>
  <circle cx="820" cy="486" r="7" fill="#FF6B86"/>

  <rect width="1200" height="900" filter="url(#s2grain)" opacity=".16" style="mix-blend-mode:overlay"/>
</svg>
